# Compile le site (amq-trainer/) et le publie sur GitHub Pages.
# Déclenché à chaque push sur main, ou à la main depuis l'onglet Actions.
# Prérequis : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un nouveau push annule celui en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amq-trainer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: amq-trainer/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Comptes Discord / Supabase : Settings → Secrets and variables → Actions, onglet Variables
      # (l'onglet Secrets est aussi accepté). Valeurs publiques par conception ; sans elles,
      # le site est compilé sans comptes, avec un avertissement dans le résumé du workflow.
      - run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning title=Comptes désactivés::VITE_SUPABASE_URL ou VITE_SUPABASE_PUBLISHABLE_KEY est vide : le site est compilé sans connexion Discord."
          fi
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: amq-trainer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
